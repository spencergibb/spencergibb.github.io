baseurl = "https://gibb.tech/"
DefaultContentLanguage = "en"
title = "Spencer Gibb"
copyright = "Spencer Gibb; all rights reserved."
canonifyurls = true

[module]
    [module.hugoVersion]
        min = "0.169.0"
    [[module.imports]]
        path = "github.com/halogenica/beautifulhugo/v5"

[security]
    # The presentation archive contains trusted, hand-authored HTML pages.
    allowContent = ['! ^text/org$']

[Params.author]
    name = "Spencer Gibb"
    github = "spencergibb"
    linkedin = "in/spencergibb"
    stackoverflow = "2730527/spencergibb"
    twitter = "spencerbgibb"
    mastodon = "https://social.sdf.org/@spencergibb"
    bluesky = "spencer.gibb.us"

[permalinks]
    # Optional. Change the permalink format for the 'post' content type.
    # The format shown here is the same one Jekyll/Octopress uses by default.
    post = "/blog/:year/:month/:day/:title/"

[taxonomies]
    # Optional. Use if you want tags and lists.
    category = "categories"

[Params]
    since = 2013
    logo = "images/spencer-gibb-devoxx-cropped-hi-res.jpg"
    subtitle = "Spring Cloud co-founder. Writing about Java, distributed systems, and developer tools."
    navShort = true
    rss = true
    mainSections = ["post","preso"]
    custom_css = ["css/beautifulhugo-main.css"]

[[menu.main]]
    name = "Writing"
    url = "/post/"
    weight = 1

[[menu.main]]
    name = "Talks"
    url = "/categories/presentations/"
    weight = 2

[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3
